<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La mia libreria</title>
<meta name="theme-color" content="#3B4F38">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EDE0;--card:#FCFAF4;--ink:#3A2A20;--mut:#7B6B5D;--g:#4E6B45;--gd:#3B4F38;--line:#DDD1BE;--beige:#EBDDC6;--amb:#F4E0B0}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#F7F1E6,#F1E9DA) fixed;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
body.lock{overflow:hidden}
h1,h2,h3,.brand{font-family:'Playfair Display',Georgia,serif;margin:0}
a{color:inherit}
.topbar{background:var(--gd);color:#F6EEDD;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:600;text-decoration:none}
.pg{position:relative;max-width:760px;margin:0 auto;padding:22px 18px 0;overflow:hidden}
.pg h1{font-size:clamp(2rem,8vw,2.8rem);font-weight:700;line-height:1.1}
.pg h1::after{content:"";display:block;width:70px;height:3px;border-radius:3px;background:var(--g);margin-top:8px}
.deco{position:absolute;right:0;top:0;width:140px}
.tabs{display:flex;gap:26px;margin-top:22px;border-bottom:1.5px solid var(--line)}
.tabs a{padding:8px 2px;text-decoration:none;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs a.on{color:var(--ink);border-color:var(--g)}
main{max-width:760px;margin:0 auto;padding:20px 18px 120px}
button,.big{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--g);color:#fff;font-weight:700;text-align:center;display:block}
button.alt,.big.alt{background:var(--card);color:var(--gd);border:1.5px solid var(--line)}
button.danger{background:var(--card);color:#A3262A;border:1.5px solid #D9B0AE}
button.link{background:none;color:inherit;padding:4px;text-decoration:underline;font-weight:400}
button.sm{padding:7px 13px;font-size:.88rem;border-radius:10px}
:focus-visible{outline:3px solid #C58A12;outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#FFFDF9;color:var(--ink)}
.hero p{color:var(--mut);max-width:34em;margin:0}
.actions{display:grid;gap:12px;max-width:420px;margin:20px 0 16px}
.big{padding:16px 18px;font-size:1.05rem}
.manual{display:flex;gap:8px;max-width:420px;margin-bottom:12px}.manual button{white-space:nowrap}
.bar{margin-bottom:6px}.bar input{margin-bottom:12px}
.flt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flt label{font-size:.85rem;color:var(--mut)}.flt select{margin-top:4px;padding:10px 8px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.cnt{color:var(--mut);margin:0}
.sel-tools{display:flex;gap:8px;align-items:center}
.bk{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(80,60,30,.1);cursor:pointer;border:2px solid transparent;transition:border-color .15s,background .15s}
.bk.picked{border-color:var(--g);background:#F3F7EE}
.bk .cv{width:68px;flex:none}.in{flex:1;min-width:0}
.in h3{font-size:1.1rem;line-height:1.25;font-weight:700}.in p{margin:2px 0 0;color:var(--mut)}
.act{display:flex;gap:8px}
.ib{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:#FFFDF9;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:.9rem}
.bk.picked .chk{background:var(--g);border-color:var(--g)}
@media(max-width:480px){.act{flex-direction:column}}
.cv{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px 6px 6px 3px;box-shadow:inset 3px 0 0 rgba(0,0,0,.12),0 2px 6px rgba(60,40,20,.3);background:#C9D6CC;display:block}
.ph{display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font:600 .78rem 'Playfair Display',serif;background:var(--g);color:#fff;overflow:hidden}
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 11px;border-radius:99px;margin:6px 6px 0 0;background:var(--beige)}
.pill.g,.pill.letto{background:#DCE6CF;color:#2F4A2A}.pill.leggendo{background:var(--amb)}
.star{color:#C58A12;letter-spacing:1px}.badge{font-size:.8rem;color:var(--g);font-weight:700}
.empty{color:var(--mut);text-align:center;padding:30px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border-radius:99px;padding:15px 22px;box-shadow:0 6px 16px rgba(59,79,56,.4);z-index:5;font-size:1rem}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(724px,calc(100vw - 28px));background:var(--gd);color:#F6EEDD;padding:12px 16px;border-radius:18px;box-shadow:0 8px 24px rgba(30,25,15,.35);display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:6}
.bulkbar[hidden]{display:none}
.bulkbar .info{font-weight:700;font-size:.95rem}
.bulkbar .b-acts{display:flex;gap:8px}
.bulkbar button.alt{background:transparent;color:#F6EEDD;border-color:rgba(246,238,221,.35)}
#modal{position:fixed;inset:0;background:rgba(40,30,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:22px}}
.top{display:flex;gap:14px;margin-bottom:12px}.top .cv{width:96px;flex:none}.top>div{flex:1}.au{color:var(--mut)}
h3{margin:18px 0 6px;font-size:1.05rem}
dl{margin:0}dl div{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}dt{width:42%;color:var(--mut)}dd{margin:0;flex:1}
.desc{color:var(--mut);font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.fr{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center;margin:12px 0}.fr>span{font-weight:700;font-size:.95rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg label{margin:0}.seg input{display:none}
.seg i{font-style:normal;display:block;padding:8px 12px;border:1.5px solid var(--line);border-radius:99px;font-size:.85rem;font-weight:600;cursor:pointer;background:#FFFDF9}
.seg input:checked+i{background:var(--g);color:#fff;border-color:var(--g)}
.stars button{background:none;color:#D3C5AE;font-size:1.8rem;padding:0 3px;display:inline-block;line-height:1}.stars .on{color:#C58A12}
.cvup{display:grid;place-items:center;border:2px dashed var(--line);border-radius:16px;height:150px;cursor:pointer;text-align:center;margin-bottom:10px;overflow:hidden;color:var(--mut)}
.cvup .cv{width:auto;height:140px;aspect-ratio:auto}
details summary{cursor:pointer;font-weight:700;margin:16px 0 4px}
form label{display:block;margin:10px 0 0;font-size:.9rem;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:20px}
.hint-box{background:var(--beige);padding:10px 14px;border-radius:12px;font-size:.88rem;color:var(--ink);margin:10px 0 14px}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
.dup{display:flex;gap:12px;margin:12px 0}.dup .cv{width:70px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 16px;border-radius:99px;z-index:20;max-width:90vw}
#toast[hidden]{display:none}
.login{max-width:360px;margin:12vh auto;padding:0 18px}.login h1{margin-bottom:6px}.login .err{color:#A3262A;min-height:1.4em}
</style></head>
<body>
<div id="app"></div><div id="modal" hidden></div><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// ====== CONFIGURAZIONE: incolla qui i due valori di Supabase (Project Settings > API) ======
const SUPABASE_URL = 'https://sbxamhfvxscyiunnwnlh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNieGFtaGZ2eHNjeWl1bm53bmxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NTc1MTIsImV4cCI6MjExMDUzMzUxMn0._3G5zfe3QfEwFXOZMSxNhTsA6W6K3jnJH5Zvia33gTQ';
// ===========================================================================================
const GB_KEY = 'AIzaSyBqPThix9CNLGta-P3DmHMV9ks3RhKdkq0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GEN = ['Narrativa','Classici','Fantasy','Fantascienza','Giallo / Thriller','Horror','Romance','Storico','Biografia','Saggistica','Poesia','Fumetti','Ragazzi','Altro'];
const ST = {da_leggere:'Da leggere', leggendo:'In lettura', letto:'Letto'};
const FMT = ['Cartaceo','Ebook','Audiolibro'];
let user = null, books = [], filt = {q:'', st:'', gen:'', so:'recenti'}, reader = null, tt;
let selectMode = false, selectedIds = new Set();

const toast = (m, ms = 2800) => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); if (ms) tt = setTimeout(() => t.hidden = true, ms); };
function modal(h) { const m = $('#modal'); m.innerHTML = `<div class="sheet">${h}</div>`; m.hidden = false; document.body.classList.add('lock'); m.onclick = e => { if (e.target === m) closeM(); }; }
function closeM() { stopScan(); $('#modal').hidden = true; document.body.classList.remove('lock'); }
function stopScan() { if (reader) { try { reader.reset(); } catch (e) {} reader = null; } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

const okIsbn = s => s.length === 13 ? [...s].reduce((a, c, i) => a + c * (i % 2 ? 3 : 1), 0) % 10 === 0 : s.length === 10 ? [...s].reduce((a, c, i) => a + (/x/i.test(c) ? 10 : +c) * (10 - i), 0) % 11 === 0 : false;
const stars = n => n ? `<span class="star" aria-label="${n} stelle su 5">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>` : '';
const fd = d => d ? new Date(d).toLocaleDateString('it-IT') : '';
const thumb = b => b.cover ? `<img class="cv" src="${esc(b.cover)}" alt="" loading="lazy">` : `<div class="cv ph">${esc(b.title)}</div>`;
function mapGenre(c = '') {
  c = c.toLowerCase();
  const m = [[/fantasy/,'Fantasy'],[/science fiction|fantascienza/,'Fantascienza'],[/mystery|thriller|crime|detective|giallo/,'Giallo / Thriller'],[/horror/,'Horror'],[/romance/,'Romance'],[/histor|stori/,'Storico'],[/biograph|memoir|autobio/,'Biografia'],[/poetry|poesi/,'Poesia'],[/comic|graphic/,'Fumetti'],[/juvenile|young adult|children|ragazz/,'Ragazzi'],[/classic/,'Classici'],[/fiction|narrativa|romanz|novel/,'Narrativa'],[/self-help|business|science|philosoph|psycholog|religion|social|political|essay|saggi|cooking|art|computers|education|economics/,'Saggistica']];
  for (const [r, g] of m) if (r.test(c)) return g;
  return '';
}

// ---------- ricerca libro online ----------
async function gb(i) {
  const L = {it:'Italiano', en:'Inglese', fr:'Francese', de:'Tedesco', es:'Spagnolo'};
  for (const q of ['isbn:' + i, i]) {
    const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + q + (GB_KEY ? '&key=' + GB_KEY : ''));
    if (!r.ok) throw new Error('errore ' + r.status);
    const j = await r.json();
    const it = q === 'isbn:' + i ? j.items?.[0] : j.items?.find(x => (x.volumeInfo.industryIdentifiers || []).some(y => y.identifier === i));
    const v = it?.volumeInfo; if (!v) continue;
    return {isbn:i, title:v.title || '', authors:(v.authors || []).join(', '), publisher:v.publisher || '', year:(v.publishedDate || '').slice(0, 4), pages:v.pageCount || null, language:L[v.language] || v.language || '', description:(v.description || '').replace(/<[^>]+>/g, ' ').trim(), cover:(v.imageLinks?.thumbnail || '').replace('http:', 'https:'), genre:mapGenre((v.categories || []).join(' '))};
  }
  return null;
}
async function ol(i) {
  const v = (await (await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${i}&format=json&jscmd=data`)).json())['ISBN:' + i]; if (!v) return null;
  return {isbn:i, title:v.title || '', authors:(v.authors || []).map(a => a.name).join(', '), publisher:v.publishers?.[0]?.name || '', year:(v.publish_date || '').match(/\d{4}/)?.[0] || '', pages:v.number_of_pages || null, cover:v.cover?.medium || '', genre:mapGenre((v.subjects || []).map(s => s.name).join(' '))};
}
async function lookup(raw) {
  const isbn = String(raw).replace(/[^0-9Xx]/g, '');
  if (!okIsbn(isbn)) return toast('ISBN non valido: controlla le cifre (10 o 13).', 4500);
  toast('Cerco il libro…', 0);
  let ge = null;
  const g = await gb(isbn).catch(e => { ge = e; return null; });
  const o = (!g || !g.cover || !g.publisher || !g.pages) ? await ol(isbn).catch(() => null) : null;
  let d = (g || o) ? {...(o || {}), ...Object.fromEntries(Object.entries(g || {}).filter(([k, v]) => v))} : null;
  if (!d) { toast(ge ? 'Google Books non risponde (' + ge.message + '): riprova tra poco o inserisci i dati a mano.' : 'Libro non trovato online (ISBN ' + isbn + '): inserisci i dati a mano.', 6000); d = {isbn}; } else $('#toast').hidden = true;
  const same = (a, b) => (a || '').toLowerCase() === (b || '').toLowerCase();
  const dup = books.find(b => (b.isbn && b.isbn === isbn) || (d.title && same(b.title, d.title) && same(b.authors, d.authors)));
  dup ? dupDlg(dup, d) : form(d);
}

// ---------- scansione ----------
async function scan() {
  modal(`<h2>Inquadra il codice a barre</h2><p class="au">Tienilo ben illuminato, a circa 15 cm.</p><video id="v" playsinline muted></video><div class="row"><button class="alt" id="x">Annulla</button></div>`);
  $('#x').onclick = closeM;
  reader = new ZXing.BrowserMultiFormatReader();
  try {
    await reader.decodeFromVideoDevice(null, 'v', r => { if (r) { const t = r.getText(); if (/^\d{10,13}$/.test(t) && okIsbn(t)) { closeM(); lookup(t); } } });
  } catch (e) { closeM(); toast('Fotocamera non disponibile: consenti l\'accesso oppure usa la foto o l\'ISBN.', 4500); }
}
async function fromPhoto(f) {
  if (!f) return;
  const url = URL.createObjectURL(f);
  try { const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url); lookup(r.getText()); }
  catch (e) { toast('Codice non letto: prova con una foto più nitida o scrivi l\'ISBN.', 4500); }
}

// ---------- dati ----------
async function load() {
  const {data, error} = await sb.from('books').select('*').order('created_at', {ascending:false});
  if (error) toast('Errore di caricamento: ' + error.message, 5000); else books = data;
}

// ---------- schede ----------
function sel(k, l, opts, v, empty) {
  const o = Array.isArray(opts) ? Object.fromEntries(opts.map(x => [x, x])) : opts;
  if (v && !(v in o)) o[v] = v;
  return `<label>${l}<select name="${k}">${empty ? '<option value="">—</option>' : ''}${Object.entries(o).map(([a, b]) => `<option value="${esc(a)}" ${a == v ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>`;
}
function form(d) {
  const f = (k, l, t = 'text', r = '') => `<label>${l}<input name="${k}" type="${t}" value="${esc(d[k])}" ${r}></label>`;
  const st = d.status || 'da_leggere';
  modal(`<h2>${d.id ? 'Modifica libro' : 'Aggiungi un libro'}</h2><form id="f">
  <label class="cvup"><input type="file" id="cvf" accept="image/*" hidden><span id="cvp">${d.cover ? `<img class="cv" src="${esc(d.cover)}" alt="">` : '<b>Carica la copertina</b><br><small>JPG o PNG</small>'}</span></label>
  <input type="hidden" name="cover" value="${esc(d.cover)}"><input type="hidden" name="rating" value="${d.rating || ''}">
  <div class="fr"><span>Titolo *</span><input name="title" required value="${esc(d.title)}" placeholder="Inserisci il titolo"></div>
  <div class="fr"><span>Autore *</span><input name="authors" required value="${esc(d.authors)}" placeholder="Inserisci l'autore"></div>
  <div class="fr"><span>Genere</span><select name="genre">${opts(GEN, d.genre, 'Seleziona un genere')}</select></div>
  <div class="fr"><span>Data di acquisto</span><input name="purchase_date" type="date" value="${esc(d.purchase_date)}"></div>
  <div class="fr"><span>Stato di lettura</span><div class="seg">${Object.entries(ST).map(([k, v]) => `<label><input type="radio" name="status" value="${k}" ${k == st ? 'checked' : ''}><i>${v}</i></label>`).join('')}</div></div>
  <div id="vt" style="display:${st == 'letto' ? 'block' : 'none'}">
    <div class="fr"><span>Voto</span><div class="stars" id="stv">${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" aria-label="${n} stelle">★</button>`).join('')}</div></div>
    <div class="fr"><span>Spiegazione del voto</span><textarea name="rating_note" rows="3" placeholder="Perché questo voto? (facoltativo)">${esc(d.rating_note)}</textarea></div>
  </div>
  <div class="fr"><span>Note</span><textarea name="notes" rows="3" placeholder="Aggiungi una nota…">${esc(d.notes)}</textarea></div>
  <details><summary>Altri dettagli del libro</summary>${f('publisher', 'Casa editrice')}${f('edition', 'Edizione')}
  <div class="g2">${f('year', 'Anno', 'number')}${f('pages', 'Pagine', 'number')}${f('language', 'Lingua')}${f('isbn', 'ISBN')}</div>
  <label>Descrizione<textarea name="description" rows="4">${esc(d.description)}</textarea></label>
  <div class="g2">${sel('format', 'Formato', FMT, d.format, 1)}${f('start_date', 'Iniziato il', 'date')}${f('end_date', 'Finito il', 'date')}</div>
  ${f('place', 'Acquistato presso')}${f('copies', 'Copie possedute', 'number', 'min="1"')}</details>
  <div class="btns"><button type="button" class="alt" id="x">Annulla</button><button type="submit">Salva libro</button></div></form>`);
  const fm = $('#f');
  $('#x').onclick = closeM;
  fm.copies.value = d.copies || 1;
  const paint = v => document.querySelectorAll('#stv button').forEach(b => b.classList.toggle('on', +b.dataset.n <= v));
  paint(d.rating || 0);
  fm.querySelectorAll('input[name="status"]').forEach(r => r.onchange = () => { $('#vt').style.display = fm.status.value == 'letto' ? 'block' : 'none'; });
  $('#stv').onclick = e => { const b = e.target.closest('button'); if (!b) return; const n = +b.dataset.n; fm.rating.value = fm.rating.value == n ? '' : n; paint(+fm.rating.value || 0); };
  $('#cvf').onchange = e => {
    const fl = e.target.files[0]; if (!fl) return;
    const im = new Image();
    im.onload = () => { const k = Math.min(1, 360 / im.width), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); const u = c.toDataURL('image/jpeg', .8); fm.cover.value = u; $('#cvp').innerHTML = `<img class="cv" src="${u}" alt="">`; };
    im.src = URL.createObjectURL(fl);
  };
  fm.onsubmit = async e => {
    e.preventDefault();
    const o = Object.fromEntries(new FormData(e.target));
    ['pages', 'rating', 'copies'].forEach(k => o[k] = o[k] ? +o[k] : null);
    ['purchase_date', 'start_date', 'end_date'].forEach(k => o[k] = o[k] || null);
    o.copies = o.copies || 1;
    if (o.status !== 'letto') { o.rating = null; o.rating_note = null; } else o.rating_note = (o.rating_note || '').trim() || null;
    const {error} = await (d.id ? sb.from('books').update(o).eq('id', d.id) : sb.from('books').insert(o));
    if (error) return toast('Errore: ' + error.message, 5000);
    await load(); closeM(); toast('Libro salvato'); location.hash = '#libreria'; render();
  };
}

// ---------- modifica multipla ----------
function bulkForm() {
  const count = selectedIds.size;
  if (!count) return;
  modal(`<h2>Modifica ${count} ${count === 1 ? 'libro' : 'libri'}</h2>
  <p class="hint-box">Compila <b>solo</b> i campi che vuoi cambiare su tutti i libri selezionati. Quelli lasciati su "Non modificare" o vuoti manterranno il valore attuale di ciascun libro. (ISBN, titolo, autore e copertina non vengono modificati).</p>
  <form id="bf">
    <input type="hidden" name="rating" value="">
    <div class="fr"><span>Genere</span><select name="genre">${opts(GEN, '', '— Non modificare —')}</select></div>
    <div class="fr"><span>Stato di lettura</span><div class="seg">
      <label><input type="radio" name="status" value="" checked><i>Non modificare</i></label>
      ${Object.entries(ST).map(([k, v]) => `<label><input type="radio" name="status" value="${k}"><i>${v}</i></label>`).join('')}
    </div></div>
    <div id="bvt" style="display:none">
      <div class="fr"><span>Voto</span><div class="stars" id="bstv">${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" aria-label="${n} stelle">★</button>`).join('')}</div></div>
      <div class="fr"><span>Spiegazione voto</span><textarea name="rating_note" rows="2" placeholder="Lascia vuoto per non modificare"></textarea></div>
    </div>
    <div class="fr"><span>Formato</span><select name="format">${opts(FMT, '', '— Non modificare —')}</select></div>
    <div class="fr"><span>Data acquisto</span><input name="purchase_date" type="date"></div>
    <div class="fr"><span>Note</span><textarea name="notes" rows="2" placeholder="Lascia vuoto per non modificare (sovrascrive le note esistenti)"></textarea></div>
    <details><summary>Altri dettagli modificabili in blocco</summary>
      <label>Casa editrice<input name="publisher" type="text" placeholder="Lascia vuoto per non modificare"></label>
      <div class="g2">
        <label>Lingua<input name="language" type="text" placeholder="Non modificare"></label>
        <label>Acquistato presso<input name="place" type="text" placeholder="Non modificare"></label>
        <label>Iniziato il<input name="start_date" type="date"></label>
        <label>Finito il<input name="end_date" type="date"></label>
      </div>
    </details>
    <div class="btns"><button type="button" class="alt" id="bx">Annulla</button><button type="submit">Applica a ${count} ${count === 1 ? 'libro' : 'libri'}</button></div>
  </form>`);

  const fm = $('#bf');
  $('#bx').onclick = closeM;
  const paint = v => document.querySelectorAll('#bstv button').forEach(b => b.classList.toggle('on', +b.dataset.n <= v));
  fm.querySelectorAll('input[name="status"]').forEach(r => r.onchange = () => {
    $('#bvt').style.display = fm.status.value === 'letto' ? 'block' : 'none';
  });
  $('#bstv').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const n = +b.dataset.n;
    fm.rating.value = fm.rating.value == n ? '' : n;
    paint(+fm.rating.value || 0);
  };

  fm.onsubmit = async e => {
    e.preventDefault();
    const raw = Object.fromEntries(new FormData(e.target));
    const patch = {};

    if (raw.genre) patch.genre = raw.genre;
    if (raw.format) patch.format = raw.format;
    if (raw.purchase_date) patch.purchase_date = raw.purchase_date;
    if (raw.start_date) patch.start_date = raw.start_date;
    if (raw.end_date) patch.end_date = raw.end_date;
    if (raw.publisher.trim()) patch.publisher = raw.publisher.trim();
    if (raw.language.trim()) patch.language = raw.language.trim();
    if (raw.place.trim()) patch.place = raw.place.trim();
    if (raw.notes.trim()) patch.notes = raw.notes.trim();

    if (raw.status) {
      patch.status = raw.status;
      if (raw.status !== 'letto') {
        patch.rating = null;
        patch.rating_note = null;
      } else {
        if (raw.rating) patch.rating = +raw.rating;
        if (raw.rating_note.trim()) patch.rating_note = raw.rating_note.trim();
      }
    }

    if (!Object.keys(patch).length) {
      return toast('Non hai selezionato nessuna modifica da applicare.');
    }

    const ids = [...selectedIds];
    const {error} = await sb.from('books').update(patch).in('id', ids);
    if (error) return toast('Errore: ' + error.message, 5000);

    await load();
    selectedIds.clear();
    selectMode = false;
    closeM();
    render();
    toast(`Aggiornati ${ids.length} ${ids.length === 1 ? 'libro' : 'libri'}`);
  };
}

function dupDlg(b, d) {
  modal(`<h2>Questo libro è già in libreria</h2><div class="dup">${thumb(b)}<div><b>${esc(b.title)}</b><br>${esc(b.authors)}<br><small class="au">${esc(b.publisher)} ${esc(b.year)} · ${b.copies || 1} ${(b.copies || 1) > 1 ? 'copie' : 'copia'}</small></div></div>
  <p>È un errore o ne hai una seconda copia?</p>
  <div class="row"><button id="d2">Ho due copie</button><button class="alt" id="de">È un'altra edizione</button><button class="link" id="dx">È un errore</button></div>`);
  $('#d2').onclick = async () => { const n = (b.copies || 1) + 1; await sb.from('books').update({copies:n}).eq('id', b.id); await load(); closeM(); toast('Ora hai ' + n + ' copie'); location.hash = '#libreria'; render(); };
  $('#de').onclick = () => form(d);
  $('#dx').onclick = () => { closeM(); detail(b.id); };
}
function detail(id) {
  const b = books.find(x => x.id == id); if (!b) return;
  const r = (l, v) => v || v === 0 ? `<div><dt>${l}</dt><dd>${esc(v)}</dd></div>` : '';
  modal(`<div class="top">${thumb(b)}<div><h2>${esc(b.title)}</h2><p class="au">${esc(b.authors)}</p><span class="pill ${b.status}">${ST[b.status]}</span> ${stars(b.status == 'letto' ? b.rating : 0)}</div></div>
  <h3>Per te</h3><dl>${r('Acquistato il', fd(b.purchase_date))}${r('Iniziato il', fd(b.start_date))}${r('Finito il', fd(b.end_date))}${r('Formato', b.format)}${r('Acquistato presso', b.place)}${r('Copie', b.copies > 1 ? b.copies : '')}${r('Spiegazione del voto', b.status == 'letto' ? b.rating_note : '')}${r('Note', b.notes)}</dl>
  <h3>Sul libro</h3><dl>${r('Casa editrice', b.publisher)}${r('Edizione', b.edition)}${r('Anno', b.year)}${r('Genere', b.genre)}${r('Pagine', b.pages)}${r('Lingua', b.language)}${r('ISBN', b.isbn)}</dl>
  ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ''}
  <div class="row"><button id="ed">Modifica</button><button class="danger" id="del">Elimina</button><button class="link" id="cl">Chiudi</button></div>`);
  $('#cl').onclick = closeM;
  $('#ed').onclick = () => form(b);
  $('#del').onclick = async () => {
    if (!confirm(`Eliminare "${b.title}" dalla libreria?`)) return;
    const {error} = await sb.from('books').delete().eq('id', id);
    if (error) return toast('Errore: ' + error.message, 5000);
    await load(); closeM(); render(); toast('Libro eliminato');
  };
}

// ---------- pagine ----------
const IC = {
  e: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  d: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>'};
const LOGO = '<svg viewBox="0 0 24 24" width="28" height="28" fill="#F3E9D7" aria-hidden="true"><rect x="3" y="5" width="4" height="15" rx="1"/><rect x="8.5" y="3" width="4" height="17" rx="1"/><rect x="14" y="6" width="4" height="14" rx="1" transform="rotate(8 16 13)"/></svg>';
const DECO = '<svg class="deco" viewBox="0 0 160 110" aria-hidden="true"><path d="M20 80c20-10 30-30 45-62" stroke="#6B8A5A" fill="none" stroke-width="2"/><g fill="#7C9A6B"><ellipse cx="38" cy="30" rx="16" ry="7" transform="rotate(-30 38 30)"/><ellipse cx="62" cy="14" rx="16" ry="7" transform="rotate(-65 62 14)"/><ellipse cx="22" cy="54" rx="16" ry="7" transform="rotate(-10 22 54)"/><ellipse cx="50" cy="52" rx="14" ry="6" transform="rotate(-40 50 52)"/></g><rect x="40" y="86" width="112" height="13" rx="2" fill="#9A6B4B"/><rect x="52" y="73" width="96" height="13" rx="2" fill="#4F6B48"/></svg>';
const opts = (o, v, e) => (e ? `<option value="">${e}</option>` : '') + Object.entries(Array.isArray(o) ? Object.fromEntries(o.map(x => [x, x])) : o).map(([a, b]) => `<option value="${esc(a)}" ${a == v ? 'selected' : ''}>${esc(b)}</option>`).join('');
async function delBook(id) {
  const b = books.find(x => x.id == id);
  if (!b || !confirm(`Eliminare "${b.title}" dalla libreria?`)) return;
  const {error} = await sb.from('books').delete().eq('id', id);
  if (error) return toast('Errore: ' + error.message, 5000);
  await load(); closeM(); render(); toast('Libro eliminato');
}
function getFilteredBooks() {
  const q = filt.q.toLowerCase();
  const l = books.filter(b => (!filt.st || b.status === filt.st) && (!filt.gen || b.genre === filt.gen) && (!q || (b.title + ' ' + (b.authors || '')).toLowerCase().includes(q)));
  if (filt.so === 'titolo') l.sort((a, b) => a.title.localeCompare(b.title, 'it'));
  if (filt.so === 'voto') l.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  return l;
}
function updateBulkUI(visibleList) {
  const n = selectedIds.size;
  const bar = $('#bulkbar');
  const fab = $('#add');
  if (bar) {
    bar.hidden = !(selectMode && n > 0);
    if (!bar.hidden) $('#binfo').textContent = `${n} ${n === 1 ? 'selezionato' : 'selezionati'}`;
  }
  if (fab) fab.hidden = selectMode;
  const allBtn = $('#selall');
  if (allBtn && visibleList) {
    const allPicked = visibleList.length > 0 && visibleList.every(b => selectedIds.has(String(b.id)));
    allBtn.textContent = allPicked ? 'Deseleziona visibili' : 'Seleziona visibili';
  }
}
function drawGrid() {
  const l = getFilteredBooks();
  $('#cnt').textContent = l.length + (l.length === 1 ? ' libro' : ' libri');
  $('#list').innerHTML = l.length ? l.map(b => {
    const idStr = String(b.id);
    const picked = selectMode && selectedIds.has(idStr);
    return `<article class="bk ${picked ? 'picked' : ''}" data-id="${idStr}">
      ${selectMode ? `<div class="chk" aria-hidden="true">${picked ? '✓' : ''}</div>` : ''}
      ${thumb(b)}
      <div class="in"><h3>${esc(b.title)}</h3><p>${esc(b.authors)}</p>${b.genre ? `<span class="pill g">${esc(b.genre)}</span>` : ''}<span class="pill ${b.status}">${ST[b.status]}</span> ${stars(b.status == 'letto' ? b.rating : 0)} ${(b.copies || 1) > 1 ? `<span class="badge">×${b.copies}</span>` : ''}</div>
      ${selectMode ? '' : `<div class="act"><button class="ib" data-e="${idStr}" aria-label="Modifica">${IC.e}</button><button class="ib" data-d="${idStr}" aria-label="Elimina">${IC.d}</button></div>`}
    </article>`;
  }).join('')
    : `<p class="empty">${books.length ? 'Nessun libro corrisponde ai filtri.' : 'La libreria è vuota. Tocca "Aggiungi libro" per iniziare.'}</p>`;
  updateBulkUI(l);
}
function render() {
  const app = $('#app');
  if (!user) {
    app.innerHTML = `<form class="login" id="lg"><h1>La mia libreria</h1><p class="au">Accedi per vedere i tuoi libri.</p><label>Email<input name="e" type="email" autocomplete="username" required></label><label>Password<input name="p" type="password" autocomplete="current-password" required></label><p class="err" id="er"></p><button>Entra</button></form>`;
    $('#lg').onsubmit = async e => { e.preventDefault(); const {error} = await sb.auth.signInWithPassword({email:e.target.e.value.trim(), password:e.target.p.value}); if (error) $('#er').textContent = 'Email o password non corretti.'; };
    return;
  }
  const h = location.hash === '#home' ? 'home' : 'lib';
  const nome = user.user_metadata?.nome || (user.email || '').split('@')[0];
  document.title = `La libreria di ${nome}`;
  const head = t => `<div class="topbar"><a class="brand" href="#libreria">${LOGO}La libreria di ${esc(nome)}</a><button class="link" id="out">Esci</button></div><div class="pg">${DECO}<h1>${t}</h1><nav class="tabs"><a href="#libreria" class="${h == 'lib' ? 'on' : ''}">Libreria</a><a href="#home" class="${h == 'home' ? 'on' : ''}">Aggiungi</a></nav></div>`;
  if (h === 'home') {
    selectMode = false; selectedIds.clear();
    app.innerHTML = head('Aggiungi un libro') + `<main><section class="hero"><p>Scansiona il codice a barre sul retro: titolo, autore e copertina arrivano da soli.</p></section>
    <div class="actions"><button class="big" id="scan">Scansiona il codice a barre</button><label class="big alt">Carica una foto del codice<input type="file" id="photo" accept="image/*" hidden></label></div>
    <div class="manual"><input id="isbn" inputmode="numeric" placeholder="Oppure scrivi l'ISBN"><button id="go">Cerca</button></div>
    <button class="link" id="hand">Inserisci i dati a mano</button></main>`;
    $('#scan').onclick = scan;
    $('#photo').onchange = e => fromPhoto(e.target.files[0]);
    $('#go').onclick = () => lookup($('#isbn').value);
    $('#isbn').onkeydown = e => { if (e.key === 'Enter') lookup(e.target.value); };
    $('#hand').onclick = () => form({});
  } else {
    app.innerHTML = head('Libreria') + `<main><div class="bar"><input id="q" type="search" placeholder="Cerca titolo o autore…" value="${esc(filt.q)}">
    <div class="flt"><label>Genere<select id="fg">${opts(GEN, filt.gen, 'Tutti i generi')}</select></label><label>Stato<select id="fs">${opts(ST, filt.st, 'Tutti gli stati')}</select></label><label>Ordina<select id="so">${opts({recenti:'Più recenti', titolo:'Titolo A–Z', voto:'Voto'}, filt.so)}</select></label></div></div>
    <div class="toolbar">
      <p class="cnt" id="cnt"></p>
      <div class="sel-tools">
        ${selectMode ? `<button type="button" class="alt sm" id="selall">Seleziona visibili</button>` : ''}
        ${books.length ? `<button type="button" class="${selectMode ? 'alt' : ''} sm" id="togglesel">${selectMode ? 'Annulla selezione' : 'Seleziona'}</button>` : ''}
      </div>
    </div>
    <div id="list"></div></main>
    <button class="fab" id="add">＋ Aggiungi libro</button>
    <div class="bulkbar" id="bulkbar" hidden>
      <span class="info" id="binfo">0 selezionati</span>
      <div class="b-acts">
        <button type="button" class="alt sm" id="bclear">Azzera</button>
        <button type="button" class="sm" id="bedit">Modifica</button>
      </div>
    </div>`;

    $('#q').oninput = e => { filt.q = e.target.value; drawGrid(); };
    $('#fs').onchange = e => { filt.st = e.target.value; drawGrid(); };
    $('#fg').onchange = e => { filt.gen = e.target.value; drawGrid(); };
    $('#so').onchange = e => { filt.so = e.target.value; drawGrid(); };
    $('#add').onclick = () => location.hash = '#home';

    if ($('#togglesel')) {
      $('#togglesel').onclick = () => {
        selectMode = !selectMode;
        if (!selectMode) selectedIds.clear();
        render();
      };
    }
    if ($('#selall')) {
      $('#selall').onclick = () => {
        const vis = getFilteredBooks();
        const allPicked = vis.every(b => selectedIds.has(String(b.id)));
        vis.forEach(b => allPicked ? selectedIds.delete(String(b.id)) : selectedIds.add(String(b.id)));
        drawGrid();
      };
    }
    if ($('#bclear')) {
      $('#bclear').onclick = () => { selectedIds.clear(); drawGrid(); };
    }
    if ($('#bedit')) {
      $('#bedit').onclick = bulkForm;
    }

    $('#list').onclick = e => {
      const r = e.target.closest('.bk');
      if (!r) return;
      if (selectMode) {
        const id = r.dataset.id;
        selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
        drawGrid();
        return;
      }
      const eb = e.target.closest('[data-e]'), db = e.target.closest('[data-d]');
      if (eb) form(books.find(x => x.id == eb.dataset.e)); else if (db) delBook(db.dataset.d); else detail(r.dataset.id);
    };
    drawGrid();
  }
  $('#out').onclick = () => sb.auth.signOut();
}
window.addEventListener('hashchange', render);
sb.auth.onAuthStateChange((_, s) => { user = s?.user || null; setTimeout(async () => { if (user) await load(); else books = []; render(); }, 0); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
